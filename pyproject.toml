[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-drift-canary-lab"
version = "0.1.0"
description = "Dependency-free training, drift monitoring and canary release checks on synthetic events"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["mlops_lab*"]
